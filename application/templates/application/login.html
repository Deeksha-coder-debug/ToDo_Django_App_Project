{% load crispy_forms_tags %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - TaskMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center">TaskMaster Login</h3>
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <hr>
                        <p class="text-center mb-0">Don't have an account? <a href="{% url 'admin:login' %}">Use Django Admin to create one</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
